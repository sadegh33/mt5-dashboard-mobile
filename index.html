<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد MT5 - نمایش قیمت پیشرفته</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #0f3460;
            --success: #00d4ff;
            --danger: #ff006e;
            --warning: #ffd60a;
            --text: #eaeaea;
            --bg: #0a0e27;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, var(--primary) 100%);
            color: var(--text);
            overflow-x: hidden;
            height: 100vh;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            padding: 15px 20px;
            border-bottom: 2px solid var(--success);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: var(--success);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .header-status {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        .status-text {
            font-size: 0.9rem;
            color: var(--success);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Controls */
        .controls {
            background: var(--secondary);
            padding: 12px 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--accent);
            overflow-x: auto;
        }

        .control-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--success);
            min-width: fit-content;
        }

        input[type="text"],
        input[type="number"],
        select {
            background: var(--primary);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            min-width: 100px;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--success);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        button {
            background: linear-gradient(135deg, var(--accent) 0%, var(--success) 100%);
            border: none;
            color: var(--primary);
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* Main Content */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        /* Price Card */
        .price-card {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 15px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .price-card:hover {
            border-color: var(--success);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            transform: translateY(-5px);
        }

        .price-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--success), transparent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-symbol {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--success);
        }

        .card-timeframe {
            font-size: 0.8rem;
            color: var(--warning);
            background: var(--primary);
            padding: 3px 8px;
            border-radius: 3px;
        }

        .card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .price-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
        }

        .price-item label {
            font-size: 0.8rem;
            color: var(--warning);
            display: block;
            margin-bottom: 3px;
        }

        .price-item value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text);
            display: block;
        }

        /* Change Percentage */
        .change-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .change-item {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }

        .change-item label {
            font-size: 0.75rem;
            color: var(--warning);
            display: block;
            margin-bottom: 3px;
        }

        .change-item value {
            font-size: 1rem;
            font-weight: bold;
            display: block;
        }

        .positive {
            color: var(--success);
        }

        .negative {
            color: var(--danger);
        }

        /* LPE Signals */
        .lpe-signals {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--accent);
        }

        .signal-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            border-left: 3px solid var(--warning);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .signal-item.active {
            border-left-color: var(--success);
            background: rgba(0, 212, 255, 0.1);
        }

        .signal-label {
            color: var(--warning);
        }

        .signal-value {
            font-weight: bold;
            color: var(--text);
        }

        /* Chart Container */
        .chart-container {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
            border: 2px solid var(--accent);
            border-radius: 8px;
            padding: 15px;
            grid-column: 1 / -1;
            height: 400px;
            position: relative;
        }

        #priceChart {
            width: 100%;
            height: 100%;
        }

        /* Footer */
        .footer {
            background: var(--secondary);
            padding: 10px 15px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--warning);
            border-top: 1px solid var(--accent);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.2rem;
            }

            .controls {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            input[type="text"],
            input[type="number"],
            select {
                width: 100%;
                min-width: auto;
            }

            .chart-container {
                height: 300px;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            animation: loading 1.5s infinite;
            margin-left: 5px;
        }

        @keyframes loading {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--success);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <h1>📊 داشبورد MT5 پیشرفته</h1>
                <div class="header-status">
                    <div class="status-indicator"></div>
                    <span class="status-text">آنلاین</span>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="control-group">
                <label for="symbolInput">نماد:</label>
                <input type="text" id="symbolInput" placeholder="مثال: EURUSD" value="EURUSD">
            </div>
            <div class="control-group">
                <label for="timeframeSelect">تایم فریم:</label>
                <select id="timeframeSelect">
                    <option value="M1">1 دقیقه</option>
                    <option value="M5">5 دقیقه</option>
                    <option value="M15">15 دقیقه</option>
                    <option value="H1" selected>ساعت</option>
                    <option value="D1">روزانه</option>
                    <option value="W1">هفتگی</option>
                </select>
            </div>
            <div class="control-group">
                <label for="refreshRate">تازه‌سازی (ثانیه):</label>
                <input type="number" id="refreshRate" value="5" min="1" max="60">
            </div>
            <button onclick="addSymbol()">✚ افزودن نماد</button>
            <button onclick="toggleAutoRefresh()" id="autoRefreshBtn">⏱ فعال‌سازی خودکار</button>
        </div>

        <!-- Content -->
        <div class="content">
            <div id="priceCardsContainer"></div>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            🚀 برو‌رسانی: <span id="lastUpdate">---</span> | 💰 منبع داده: Forex API | 📍 موقعیت: وب‌بردی
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
